name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', LICENSE]
  pull_request:
    paths-ignore: ['**/*.md', LICENSE]
  workflow_dispatch:

concurrency:
  # A shared main group can discard pending release runs even without cancellation.
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-check:
    name: Validate release automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test release detection and tagging
        run: python3 -B -m unittest discover -s Tests -p 'test_release_tag.py' -v
      - name: Validate marketing version change
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT: ${{ github.sha }}
        run: python3 -B scripts/release_tag.py --before "$BEFORE" --commit "$COMMIT"

  release-tag:
    name: Tag release
    needs: [release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish tag for a marketing version increase
        id: tag
        env:
          BEFORE: ${{ github.event.before }}
          COMMIT: ${{ github.sha }}
        run: python3 -B scripts/release_tag.py --before "$BEFORE" --commit "$COMMIT" --publish
      - name: Publish GitHub Release for the tag
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        # A rerun finds the release already published and leaves it, and any edited notes, alone.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a GitHub Release"
          else
            gh release create "$TAG" --verify-tag --title "Hotify ${TAG#v}" --generate-notes
          fi

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', LICENSE]
  pull_request:
    paths-ignore: ['**/*.md', LICENSE]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWIFT_SOURCES: Hotify CoolifyAPI/Sources CoolifyAPI/Tests CoolifyAPI/Package.swift

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # swift-format ships with the Xcode toolchain and reads .swift-format at the repo root.
      - name: swift format lint
        run: swift format lint --strict --recursive --parallel $SWIFT_SOURCES

  test:
    name: Test CoolifyAPI
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CoolifyAPI
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # No .build cache: the package has no dependencies, and a fresh checkout
      # gives every source a new mtime, so a restored .build is rebuilt anyway.
      # LiveCoolifyTests skip on their own because COOLIFY_LIVE_TESTS is not set here.
      - name: swift test
        run: swift test

  build:
    name: Build (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .spm
          key: spm-packages-${{ hashFiles('Hotify.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-packages-

      # Package targets such as PostHog keep their mtimes through .spm, so Xcode
      # reuses their cached build products and only recompiles the app sources.
      # Keyed on the Xcode build because module caches do not survive a toolchain change.
      - uses: actions/cache@v4
        with:
          path: .derivedData
          key: derived-data-${{ matrix.name }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Hotify.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: derived-data-${{ matrix.name }}-${{ steps.toolchain.outputs.xcode }}-

      # Dry build: no signing, so it needs no certificates, profiles, or team access.
      # Package versions come only from the committed Package.resolved.
      # arm64 only: a generic destination otherwise builds x86_64 too, which doubles compile time.
      # No index store: nothing reads it on CI.
      - name: xcodebuild build
        run: |
          xcodebuild build \
            -project Hotify.xcodeproj \
            -scheme Hotify \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath .derivedData \
            -clonedSourcePackagesDirPath .spm \
            -disableAutomaticPackageResolution \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
